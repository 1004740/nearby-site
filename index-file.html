<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zimbabwe Currency Dashboard</title>
    <!-- React -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
    <!-- Babel -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
    <!-- Tailwind CSS -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/tailwindcss/2.2.19/tailwind.min.css" rel="stylesheet">
    <style>
        .scrollbar-thin::-webkit-scrollbar {
            width: 6px;
        }
        .scrollbar-thin::-webkit-scrollbar-track {
            background: #f1f1f1;
        }
        .scrollbar-thin::-webkit-scrollbar-thumb {
            background: #888;
            border-radius: 3px;
        }
    </style>
</head>
<body class="bg-gray-50">
    <div id="root"></div>
    <script type="text/babel">
        const MainCurrencyDashboard = () => {
            const [liveRates, setLiveRates] = React.useState({
                currencies: {
                    USD: { rate: 1, change: 0.5, symbol: 'USD' },
                    ZWL: { rate: 650, change: -1.2, symbol: 'ZWL' },
                    ZAR: { rate: 18, change: 0.8, symbol: 'ZAR' },
                    GBP: { rate: 0.79, change: -0.5, symbol: 'GBP' }
                },
                marketPrices: {
                    'Daily Change': 0.3,
                    'Weekly Trend': 1.2
                }
            });

            const [news, setNews] = React.useState([
                { title: "Zimbabwe currency stabilizes after new policy reforms.", url: "#", date: "2025-02-03", source: "Bloomberg" },
                { title: "Reserve Bank announces new gold-backed measures.", url: "#", date: "2025-02-02", source: "Reuters" },
                { title: "Inflation trends show mixed signals.", url: "#", date: "2025-02-01", source: "Financial Times" },
                { title: "Experts analyze Zimbabwe's monetary policy.", url: "#", date: "2025-01-31", source: "The Economist" },
                { title: "Government reviews forex regulations.", url: "#", date: "2025-01-30", source: "ZBC News" }
            ]);

            const [zimbabweTime, setZimbabweTime] = React.useState(new Date());

            React.useEffect(() => {
                const timeTimer = setInterval(() => {
                    setZimbabweTime(new Date());
                }, 1000);

                return () => clearInterval(timeTimer);
            }, []);

            const formatTime = (date) => {
                return date.toLocaleString('en-US', {
                    timeZone: 'Africa/Harare',
                    hour: '2-digit',
                    minute: '2-digit',
                    second: '2-digit',
                    hour12: true
                });
            };

            const formatDate = (date) => {
                return date.toLocaleString('en-US', {
                    timeZone: 'Africa/Harare',
                    weekday: 'long',
                    year: 'numeric',
                    month: 'long',
                    day: 'numeric'
                });
            };

            const baseCurrency = { code: 'USD', name: 'US Dollar', flag: '🇺🇸', symbol: '$' };

            const otherCurrencies = [
                { code: 'ZWL', name: 'Zimbabwe Dollar', flag: '🇿🇼', symbol: 'Z$' },
                { code: 'ZAR', name: 'South African Rand', flag: '🇿🇦', symbol: 'R' },
                { code: 'GBP', name: 'British Pound', flag: '🇬🇧', symbol: '£' }
            ];

            return (
                <div className="max-w-5xl mx-auto bg-white p-4 sm:p-8">
                    <div className="text-center mb-8">
                        <div className="bg-black border-2 border-white inline-block rounded-xl shadow-xl px-6 py-4 sm:px-12 sm:py-6">
                            <div className="text-lg sm:text-2xl text-white font-semibold mb-2 sm:mb-3">{formatDate(zimbabweTime)}</div>
                            <div className="text-3xl sm:text-5xl font-extrabold text-white tracking-wider">{formatTime(zimbabweTime)}</div>
                            <div className="text-xs sm:text-md text-gray-300 mt-1 sm:mt-2 flex items-center justify-center">
                                <span className="mr-2">🇿🇼</span>Harare, Zimbabwe
                            </div>
                        </div>
                    </div>

                    <div className="grid grid-cols-1 lg:grid-cols-4 gap-4 sm:gap-8">
                        <div className="lg:col-span-3 space-y-4 sm:space-y-8">
                            <div className="bg-gray-100 rounded-lg shadow-lg p-4 sm:p-6">
                                <h2 className="text-lg sm:text-xl font-semibold mb-2 sm:mb-4 text-black">Market Overview</h2>
                                <div className="grid grid-cols-2 gap-2 sm:gap-4">
                                    <div className="p-2 sm:p-4 bg-gray-200 hover:bg-gray-300 transition duration-200 rounded-lg">
                                        <div className="text-xs sm:text-base text-gray-700">Daily Change</div>
                                        <div className={`text-base sm:text-2xl font-semibold ${liveRates.marketPrices['Daily Change'] > 0 ? 'text-green-600' : 'text-red-600'}`}>
                                            {liveRates.marketPrices['Daily Change'].toFixed(1)}%
                                        </div>
                                    </div>
                                    <div className="p-2 sm:p-4 bg-gray-200 hover:bg-gray-300 transition duration-200 rounded-lg">
                                        <div className="text-xs sm:text-base text-gray-700">Weekly Trend</div>
                                        <div className={`text-base sm:text-2xl font-semibold ${liveRates.marketPrices['Weekly Trend'] > 0 ? 'text-green-600' : 'text-red-600'}`}>
                                            {liveRates.marketPrices['Weekly Trend'].toFixed(1)}%
                                        </div>
                                    </div>
                                </div>
                            </div>

                            <div className="bg-gray-100 rounded-lg shadow-lg overflow-hidden divide-y divide-gray-300">
                                <div className="p-4 sm:p-6 hover:bg-gray-200 transition duration-200">
                                    <div className="flex justify-between items-center">
                                        <div>
                                            <div className="text-base sm:text-xl font-semibold text-black hover:text-gray-600">
                                                {baseCurrency.flag} {baseCurrency.name}
                                            </div>
                                            <div className="text-xs sm:text-base text-gray-700">({baseCurrency.symbol})</div>
                                        </div>
                                        <div className="text-right">
                                            <div className="text-lg sm:text-2xl font-semibold text-black">{baseCurrency.symbol}1.00</div>
                                            <div className="text-xs sm:text-lg text-green-600">▲ 0.50%</div>
                                        </div>
                                    </div>
                                </div>
                                {otherCurrencies.map(currency => (
                                    <div key={currency.code} className="p-4 sm:p-6 hover:bg-gray-200 transition duration-200">
                                        <div className="flex justify-between items-center">
                                            <div>
                                                <div className="text-base sm:text-xl font-semibold text-black hover:text-gray-600">
                                                    {currency.flag} {currency.name}
                                                </div>
                                                <div className="text-xs sm:text-base text-gray-700">({currency.symbol})</div>
                                            </div>
                                            <div className="text-right">
                                                <div className="text-lg sm:text-2xl font-semibold text-black">
                                                    {baseCurrency.symbol}{(liveRates.currencies[currency.code].rate).toFixed(2)}
                                                </div>
                                                <div className={`text-xs sm:text-lg ${liveRates.currencies[currency.code].change > 0 ? 'text-green-600' : 'text-red-600'}`}>
                                                    {liveRates.currencies[currency.code].change > 0 ? '▲' : '▼'} 
                                                    {Math.abs(liveRates.currencies[currency.code].change).toFixed(2)}%
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                ))}
                            </div>
                        </div>

                        <div className="lg:col-span-1">
                            <div className="bg-gray-100 rounded-lg shadow-lg p-4 sm:p-6 h-full">
                                <h2 className="text-lg sm:text-xl font-semibold mb-4 text-black">Latest News</h2>
                                <div className="space-y-2 sm:space-y-4 overflow-y-auto scrollbar-thin max-h-96 pr-1 sm:pr-2">
                                    {news.map((item, index) => (
                                        <a key={index} href={item.url} target="_blank" rel="noopener noreferrer"
                                           className="block p-2 sm:p-4 rounded-lg transition duration-300 ease-in-out 
                                                    bg-gray-200 hover:bg-blue-100 
                                                    transform hover:-translate-x-1 sm:hover:-translate-x-2 
                                                    border border-transparent hover:border-blue-200 
                                                    shadow-sm hover:shadow-md">
                                            <div className="text-sm sm:text-base font-semibold text-gray-800 hover:text-blue-700 transition duration-200">
                                                {item.title}
                                            </div>
                                            <div className="text-xs sm:text-sm mt-1 text-gray-600 hover:text-blue-600 transition duration-200">
                                                {item.date} - {item.source}
                                            </div>
                                        </a>
                                    ))}
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        ReactDOM.render(<MainCurrencyDashboard />, document.getElementById('root'));
    </script>
</body>
</html>
